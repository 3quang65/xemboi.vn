<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="hc_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#hc_grad)" stroke="#4ade80" stroke-width="3" />
  <!-- Trigrams of I Ching (Quẻ Bát Quái) -->
  <!-- Top: Qian (3 solid lines) -->
  <line x1="32" y1="32" x2="68" y2="32" stroke="#86efac" stroke-width="3" stroke-linecap="round" />
  <!-- Middle: Kan (broken - solid - broken) -->
  <line x1="32" y1="44" x2="46" y2="44" stroke="#86efac" stroke-width="3" stroke-linecap="round" />
  <line x1="54" y1="44" x2="68" y2="44" stroke="#86efac" stroke-width="3" stroke-linecap="round" />
  <line x1="32" y1="56" x2="68" y2="56" stroke="#facc15" stroke-width="4" stroke-linecap="round" />
  <line x1="32" y1="68" x2="46" y2="68" stroke="#86efac" stroke-width="3" stroke-linecap="round" />
  <line x1="54" y1="68" x2="68" y2="68" stroke="#86efac" stroke-width="3" stroke-linecap="round" />
  <!-- Divination coins / Yarrow stalks symbol -->
  <circle cx="50" cy="18" r="5" fill="#facc15" stroke="#14532d" stroke-width="1.5" />
  <circle cx="50" cy="82" r="5" fill="#facc15" stroke="#14532d" stroke-width="1.5" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tm_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#tm_grad)" stroke="#38bdf8" stroke-width="3" />
  <!-- Sundial / Celestial Calendar Wheel -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="3,3" />
  <circle cx="50" cy="50" r="22" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" />
  <!-- Compass pointer (North Star / Trạch cát) -->
  <polygon points="50,20 55,48 50,45 45,48" fill="#f43f5e" />
  <polygon points="50,80 55,52 50,55 45,52" fill="#e0f2fe" />
  <circle cx="50" cy="50" r="4" fill="#fbbf24" stroke="#082f49" stroke-width="1.5" />
  <!-- 4 Celestial Points -->
  <circle cx="50" cy="14" r="3" fill="#38bdf8" />
  <circle cx="50" cy="86" r="3" fill="#38bdf8" />
  <circle cx="14" cy="50" r="3" fill="#38bdf8" />
  <circle cx="86" cy="50" r="3" fill="#38bdf8" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="lv_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#lv_grad)" stroke="#f472b6" stroke-width="3" />
  <!-- Five Elements Pentagon (Kim Mộc Thủy Hỏa Thổ) -->
  <polygon points="50,20 78,40 68,74 32,74 22,40" fill="none" stroke="#fbcfe8" stroke-width="2" />
  <!-- 5 Nodes for the 5 elements -->
  <circle cx="50" cy="20" r="5" fill="#facc15" stroke="#fff" stroke-width="1.5" /> <!-- Thổ -->
  <circle cx="78" cy="40" r="5" fill="#e2e8f0" stroke="#fff" stroke-width="1.5" /> <!-- Kim -->
  <circle cx="68" cy="74" r="5" fill="#38bdf8" stroke="#fff" stroke-width="1.5" /> <!-- Thủy -->
  <circle cx="32" cy="74" r="5" fill="#4ade80" stroke="#fff" stroke-width="1.5" /> <!-- Mộc -->
  <circle cx="22" cy="40" r="5" fill="#f43f5e" stroke="#fff" stroke-width="1.5" /> <!-- Hỏa -->
  <!-- Calligraphy / Seal square in center -->
  <rect x="42" y="42" width="16" height="16" fill="#be185d" stroke="#fef08a" stroke-width="1.5" />
  <text x="50" y="54" font-family="'Noto Serif', serif" font-size="10" fill="#fef08a" font-weight="bold" text-anchor="middle">Việt</text>
</svg>
